name: Actualizar File Manifest del README

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📋 Generar File Manifest + bloques colapsables
        run: python update_readme_tree.py

      - name: 🚀 Commit automático del README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README.md ya está actualizado."
            exit 0
          fi
          git add README.md
          git commit -m "docs: actualizar file manifest [skip ci]"
          git push
