name: Actualizar mapas y File Manifest

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repository-documentation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🧩 Instalar Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: 🔎 Verificar Graphviz
        run: dot -V

      - name: 📋 Generar Manifest + 2 grafos
        run: python update_readme_tree.py

      - name: 🚀 Commit automático de documentación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md docs/repository-map.md docs/repository-structure.dot docs/repository-structure.svg docs/repository-architecture.dot docs/repository-architecture.svg; then
            echo "Documentación ya está actualizada."
            exit 0
          fi

          git add README.md docs/repository-map.md docs/repository-structure.dot docs/repository-structure.svg docs/repository-architecture.dot docs/repository-architecture.svg docs/canvas
          git commit -m "docs: actualizar mapas y manifest [skip ci]"
          git push
