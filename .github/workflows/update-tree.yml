name: Actualizar mapa y File Manifest

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repository-documentation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📋 Generar File Manifest + Repository Map
        run: python update_readme_tree.py

      - name: 🚀 Commit automático de documentación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md docs/repository-map.md docs/repository-map.html; then
            echo "Documentación ya está actualizada."
            exit 0
          fi
          git add README.md docs/repository-map.md docs/repository-map.html
          git commit -m "docs: actualizar repository map y manifest [skip ci]"
          git push
