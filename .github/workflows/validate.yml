name: Validar repositorio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pruebas y validaciones estáticas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar sintaxis Python
        run: python -m compileall -q update_readme_tree.py scripts docs tests

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v

      - name: Validar JSON
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            python -m json.tool "$file" > /dev/null
          done < <(find infrastructure -type f -name '*.json' -print0)

      - name: Validar sintaxis Shell
        shell: bash
        run: |
          for file in scripts/bajada scripts/subida scripts/infra-git-sync.sh scripts/infra-sync.sh scripts/infra-wrapper.sh scripts/install-infra-wrappers.sh scripts/install-sync-commands.sh sync-repo.sh; do
            bash -n "$file"
          done
